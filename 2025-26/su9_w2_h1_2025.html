<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SU9 WTTV GR.IB MS 2025/26</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');
  :root {
    --bg:#0d0f14; --panel:#141720; --border:#252a38;
    --accent:#ff3d2e; --text:#e8eaf0; --muted:#6b7280; --grid:#1e2333;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; min-height:100vh; padding:24px 16px 40px; }
  .card { max-width:780px; margin:0 auto; background:var(--panel); overflow:hidden; }
  .header {
    background:linear-gradient(135deg,#1a0a08 0%,#0d1220 100%);
    border-bottom:3px solid var(--accent);
    padding:28px 28px 22px; position:relative; overflow:hidden;
  }
  .header::before {
    content:''; position:absolute; top:-40px; right:-40px;
    width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle,rgba(255,61,46,.15) 0%,transparent 70%);
    pointer-events:none;
  }
  .club-title { font-family:'Bebas Neue',sans-serif; font-size:clamp(1.9rem,7vw,3.2rem); color:var(--text); letter-spacing:.08em; line-height:1; margin-bottom:10px; }
  .players-line { font-family:'IBM Plex Sans',sans-serif; font-size:clamp(.78rem,2.2vw,.92rem); font-weight:400; line-height:1.5; margin-bottom:7px; }
  .pl-stamp { color:#ff3d2e; }
  .pl-guest { color:var(--text); }
  .period-line { font-family:'IBM Plex Mono',monospace; font-size:clamp(.68rem,1.8vw,.78rem); color:var(--muted); letter-spacing:.06em; }
  .chart-section { padding:24px 20px 28px; }
  .chart-title { font-family:'IBM Plex Mono',monospace; font-size:.68rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }
  svg#chart { display:block; width:100%; height:auto; overflow:visible; }
  .footer { border-top:1px solid var(--border); padding:12px 28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .footer-note { font-size:.65rem; color:var(--muted); font-family:'IBM Plex Mono',monospace; letter-spacing:.06em; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; }
  .legend-item { display:flex; align-items:center; gap:5px; font-size:.65rem; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
  .legend-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .legend-diamond { width:8px; height:8px; flex-shrink:0; transform:rotate(45deg); border:1.5px solid #ff9500; background:transparent; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="club-title">SU9 WTTV GR.IB MS 2025/26</div>
    <div class="players-line">
      <span class="pl-stamp">Hannes · Heinz · Branko</span>
      &nbsp;
      <span class="pl-guest">(Bary · Johannes · Lukas · Ai-Mei · Max)</span>
    </div>
    <div class="period-line">Sept. 2025 – Apr. 2026 · WTTV Gruppe Ib</div>
  </div>
  <div class="chart-section">
    <div class="chart-title">Wertungspunkte-Verlauf · kumuliert</div>
    <svg id="chart" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="footer">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div><span>Sieg (+2 +A−B/10)</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#60a5fa"></div><span>Unentschieden (+1)</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#6b7280"></div><span>Niederlage (A−B/10)</span></div>
      <div class="legend-item"><div class="legend-diamond"></div><span>Spielfrei (0)</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#6b7280;opacity:.4;border:1px solid #888;border-radius:2px;transform:rotate(45deg);border-radius:0"></div><span>Ausstehend</span></div>
    </div>
    <div class="footer-note">SU9Ana · WTTV · W2 H1 · 2025/26</div>
  </div>
</div>
<script>
const rounds = [
  // DG1
  {dg:1,r:1, rnd:1,  A:6,B:2,sf:false,opp:'DOEB3'},
  {dg:1,r:2, rnd:2,  A:3,B:6,sf:false,opp:'POSW5'},
  {dg:1,r:3, rnd:3,  A:1,B:6,sf:false,opp:'NFS10'},
  {dg:1,r:4, rnd:4,  A:5,B:5,sf:false,opp:'UNO2'},
  {dg:1,r:5, rnd:5,  A:1,B:6,sf:false,opp:'SKFL12'},
  {dg:1,r:6, rnd:6,  A:4,B:6,sf:false,opp:'HAK4'},
  {dg:1,r:7, rnd:7,  A:3,B:6,sf:false,opp:'LENZ6'},
  {dg:1,r:8, rnd:8,  A:3,B:6,sf:false,opp:'KORN5'},
  {dg:1,r:9, rnd:9,  A:6,B:2,sf:false,opp:'SOK2'},
  // DG2
  {dg:2,r:1, rnd:10, A:3,B:6,sf:false,opp:'DOEB3'},
  {dg:2,r:2, rnd:11, A:2,B:6,sf:false,opp:'POSW5'},
  {dg:2,r:3, rnd:12, A:2,B:6,sf:false,opp:'NFS10'},
  {dg:2,r:4, rnd:13, A:null,B:null,sf:false,opp:'UNO2'},
  {dg:2,r:5, rnd:14, A:5,B:5,sf:false,opp:'SKFL12'},
  {dg:2,r:6, rnd:15, A:null,B:null,sf:false,opp:'HAK4'},
  {dg:2,r:7, rnd:16, A:null,B:null,sf:false,opp:'LENZ6'},
  {dg:2,r:8, rnd:17, A:null,B:null,sf:false,opp:'KORN5'},
  {dg:2,r:9, rnd:18, A:null,B:null,sf:false,opp:'SOK2'},
];

function calcDelta(d) {
  if (d.sf) return 0;
  if (d.A === null) return null;
  if (d.A > d.B) return 2 + (d.A - d.B) / 10;
  if (d.A === d.B) return 1;
  return (d.A - d.B) / 10;
}

let cum = 0;
const points = [{ rnd:0, z:0, sf:false, delta:0, pending:false }];
for (const d of rounds) {
  const delta = calcDelta(d);
  if (delta === null) {
    points.push({ rnd:d.rnd, z:cum, sf:false, delta:null, pending:true, opp:d.opp, dg:d.dg, r:d.r });
  } else {
    cum = Math.round((cum + delta) * 1000) / 1000;
    points.push({ rnd:d.rnd, z:cum, sf:d.sf, delta, pending:false, opp:d.opp||'', A:d.A, B:d.B, dg:d.dg, r:d.r });
  }
}

const svg = document.getElementById('chart');
const W = 680, H = 320;
const PAD = { top:22, right:28, bottom:68, left:46 };
const CW = W - PAD.left - PAD.right;
const CH = H - PAD.top - PAD.bottom;
const nRounds = rounds.length;

const zVals = points.map(p => p.z);
const zMin = Math.min(...zVals);
const zMax = Math.max(...zVals);
const yMin = Math.floor(zMin - 0.8);
const yMax = Math.ceil(zMax + 0.8);

function xPos(rnd) { return PAD.left + (rnd / nRounds) * CW; }
function yPos(z) { return PAD.top + (1 - (z - yMin) / (yMax - yMin)) * CH; }

const C = {
  bg:'#0d0f14', grid:'#1e2333', axis:'#3a4155', label:'#6b7280',
  dot_win:'#22c55e', dot_neu:'#60a5fa', dot_los:'#6b7280',
  dot_sf:'#ff9500', zero:'#374151', dg_sep:'#252a38',
};

let out = '';
out += `<rect width="${W}" height="${H}" fill="${C.bg}" rx="2"/>`;
out += `<defs><clipPath id="cp"><rect x="${PAD.left}" y="${PAD.top}" width="${CW}" height="${CH}"/></clipPath></defs>`;

// Y grid
for (let yt = Math.ceil(yMin); yt <= Math.floor(yMax); yt++) {
  if ((yMax - yMin) > 12 && yt % 2 !== 0) continue;
  const yp = yPos(yt);
  const isZero = yt === 0;
  out += `<line x1="${PAD.left}" y1="${yp}" x2="${PAD.left+CW}" y2="${yp}" stroke="${isZero?C.zero:C.grid}" stroke-width="${isZero?1.5:0.7}" stroke-dasharray="${isZero?'4,3':'none'}"/>`;
  out += `<text x="${PAD.left-7}" y="${yp+4}" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="9" fill="${isZero?'#9ca3af':C.label}">${yt}</text>`;
}

// Separator
const DG_SPLIT = rounds.findIndex(r => r.dg === 2);
const xSep = xPos(DG_SPLIT);
out += `<line x1="${xSep}" y1="${PAD.top}" x2="${xSep}" y2="${PAD.top+CH}" stroke="${C.dg_sep}" stroke-width="1.2" stroke-dasharray="5,4" clip-path="url(#cp)"/>`;

// DG labels
out += `<text x="${PAD.left + CW*0.25}" y="${PAD.top-7}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="9" fill="#4b5563" letter-spacing="1">DURCHGANG 1</text>`;
out += `<text x="${PAD.left + CW*0.75}" y="${PAD.top-7}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="9" fill="#4b5563" letter-spacing="1">DURCHGANG 2</text>`;

// X ticks + score labels
for (let i = 1; i <= nRounds; i++) {
  const xp = xPos(i);
  const d = rounds[i-1];
  const rLabel = d.r <= 9 ? 'R'+d.r : 'R'+d.r;
  out += `<line x1="${xp}" y1="${PAD.top+CH}" x2="${xp}" y2="${PAD.top+CH+5}" stroke="${C.axis}" stroke-width="0.8"/>`;
  out += `<text x="${xp}" y="${PAD.top+CH+16}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8" fill="${C.label}">${rLabel}</text>`;
  // Score
  const p = points[i];
  const scoreStr = p.pending ? '–' : (p.sf ? 'sf' : p.A+':'+p.B);
  out += `<text x="${xp}" y="${PAD.top+CH+28}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="7" fill="#4b5563">${scoreStr}</text>`;
  // Opponent
  if (d.opp) out += `<text x="${xp}" y="${PAD.top+CH+39}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="7" fill="#374151">${d.opp}</text>`;
}

// Axes
out += `<line x1="${PAD.left}" y1="${PAD.top}" x2="${PAD.left}" y2="${PAD.top+CH}" stroke="${C.axis}" stroke-width="1"/>`;
out += `<line x1="${PAD.left}" y1="${PAD.top+CH}" x2="${PAD.left+CW}" y2="${PAD.top+CH}" stroke="${C.axis}" stroke-width="1"/>`;
out += `<text transform="rotate(-90)" x="${-(PAD.top+CH/2)}" y="12" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="9" fill="${C.label}" letter-spacing="1">WERTUNG</text>`;
out += `<text x="${PAD.left+CW/2}" y="${H-4}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="9" fill="${C.label}" letter-spacing="1">RUNDE</text>`;

// Line path (only played points)
let pathD = `M${xPos(0)},${yPos(0)} `;
// Build segments: connect consecutive non-pending points
// For DG1: connect all (including spielfrei as waypoints)
// For DG2: break at pending gaps
let lastPlayed = { rnd:0, z:0 };
let inGap = false;
for (let i = 1; i < points.length; i++) {
  const p = points[i];
  if (p.pending) {
    inGap = true;
    continue;
  }
  if (inGap) {
    // Start new segment from last played
    pathD += `M${xPos(lastPlayed.rnd)},${yPos(lastPlayed.z)} `;
    inGap = false;
  }
  pathD += `L${xPos(p.rnd)},${yPos(p.z)} `;
  lastPlayed = p;
}

out += `<path d="${pathD.trim()}" fill="none" stroke="#ff3d2e" stroke-width="5" stroke-opacity="0.12" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#cp)"/>`;
out += `<path d="${pathD.trim()}" fill="none" stroke="#ff3d2e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#cp)"/>`;

// Dots + Z labels
for (let i = 1; i < points.length; i++) {
  const p = points[i];
  const xp = xPos(p.rnd);
  const yp = yPos(p.z);

  if (p.pending) {
    // Hollow rotated square (ausstehend)
    const s = 5;
    out += `<polygon points="${xp},${yp-s} ${xp+s},${yp} ${xp},${yp+s} ${xp-s},${yp}" fill="none" stroke="#555" stroke-width="1.2" opacity="0.5"/>`;
    continue;
  }

  if (p.sf) {
    const s = 5;
    out += `<polygon points="${xp},${yp-s} ${xp+s},${yp} ${xp},${yp+s} ${xp-s},${yp}" fill="${C.bg}" stroke="${C.dot_sf}" stroke-width="1.5"/>`;
  } else {
    const col = p.delta > 1 ? C.dot_win : (p.delta === 1 ? C.dot_neu : C.dot_los);
    out += `<circle cx="${xp}" cy="${yp}" r="5" fill="${C.bg}" stroke="${col}" stroke-width="2"/>`;
    out += `<circle cx="${xp}" cy="${yp}" r="2.5" fill="${col}"/>`;
  }

  // Z label
  const prevZ = points[i-1].z;
  const textY = p.z >= prevZ ? yp - 10 : yp + 18;
  out += `<text x="${xp}" y="${textY}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8" fill="#9ca3af">${p.z.toFixed(1)}</text>`;
}

svg.innerHTML = out;
</script>
</body>
</html>
