<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SU9 W1 2025/26</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0f14;color:#e8eaf0;font-family:'IBM Plex Sans',sans-serif;padding:20px;min-height:100vh;display:flex;align-items:flex-start;justify-content:center}
.card{background:#141720;border-radius:12px;padding:22px 26px;max-width:820px;width:100%}
.title{font-family:'Bebas Neue',sans-serif;font-size:2.3rem;color:#fff;letter-spacing:2px;line-height:1}
.players{font-family:'IBM Plex Mono',monospace;font-size:0.82rem;margin-top:6px;line-height:1.4}
.stamp{color:#3b82f6}
.guest{color:#555}
.period{color:#555;font-size:0.73rem;margin-top:4px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.5px}
.chart-wrap{margin-top:18px}
svg{display:block;width:100%;overflow:visible}
</style>
</head>
<body>
<div class="card">
  <div class="title">SU9 WTTV 3.KL.B MS 2025/26</div>
  <div class="players">
    <span class="stamp">Richard · Max · Bary · Hubert</span><span class="guest"> (Valeria)</span>
  </div>
  <div class="period">Sept. 2025 – Apr. 2026 &nbsp;·&nbsp; WTTV 3. Klasse B</div>
  <div class="chart-wrap">
    <canvas id="c" style="width:100%;border-radius:6px"></canvas>
  </div>
</div>
<script>
// ---- Daten ----
// W1 2025/26: WTTV, max=7, 2pts/win
// Formel: Sieg→2+(A-B)/10, Unentsch→1, Niederlage→(A-B)/10
const rounds = [
  // DG1
  {dg:1,r:1,a:3,b:6,opp:'HAN1'},
  {dg:1,r:2,a:6,b:4,opp:'TT143'},
  {dg:1,r:3,a:6,b:3,opp:'SSH3'},
  {dg:1,r:4,a:6,b:3,opp:'LENZ4'},
  {dg:1,r:5,a:4,b:6,opp:'NFS7'},
  {dg:1,r:6,a:6,b:4,opp:'LSV6'},
  {dg:1,r:7,a:1,b:6,opp:'EDEN4'},
  {dg:1,r:8,a:1,b:6,opp:'SKFL10'},
  {dg:1,r:9,a:5,b:5,opp:'KONT7'},
  // DG2
  {dg:2,r:1,a:3,b:6,opp:'HAN1'},
  {dg:2,r:2,a:5,b:5,opp:'TT143'},
  {dg:2,r:3,a:1,b:6,opp:'SSH3'},
  {dg:2,r:4,a:5,b:5,opp:'LENZ4'},
  {dg:2,r:5,a:null,b:null,opp:'NFS7'},  // ausstehend
  {dg:2,r:6,a:6,b:2,opp:'LSV6'},
  {dg:2,r:7,a:null,b:null,opp:'EDEN4'},
  {dg:2,r:8,a:null,b:null,opp:'SKFL10'},
  {dg:2,r:9,a:null,b:null,opp:'KONT7'},
];

function delta(a,b){
  if(a===null)return null;
  if(a>b)return 2+(a-b)/10;
  if(a===b)return 1;
  return (a-b)/10;
}

// Kumuliere Z
let z=0;
const pts=[{slot:0,z:0,type:'start',dg:1}];
for(let i=0;i<rounds.length;i++){
  const rd=rounds[i];
  const d=delta(rd.a,rd.b);
  if(i===9)pts.push({slot:10,z:z,type:'anchor',dg:2}); // DG2 Ankerpunkt
  if(d!==null){
    z=Math.round((z+d)*10)/10;
    const slot=rd.dg===1?rd.r:(10+rd.r);
    pts.push({slot,z,d,type:rd.a>rd.b?'win':rd.a===rd.b?'draw':'loss',opp:rd.opp,a:rd.a,b:rd.b,dg:rd.dg,r:rd.r});
  } else {
    const slot=rd.dg===1?rd.r:(10+rd.r);
    pts.push({slot,z,d:null,type:'pending',opp:rd.opp,dg:rd.dg,r:rd.r});
  }
}

// Canvas render
const canvas=document.getElementById('c');
function render(){
  const W=canvas.offsetWidth||760;
  const H=Math.round(W*0.42);
  canvas.width=W*2; canvas.height=H*2;
  canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(2,2);
  const PAD={top:28,right:80,bottom:55,left:52};
  const cw=W-PAD.left-PAD.right;
  const ch=H-PAD.top-PAD.bottom;

  ctx.fillStyle='#141720';
  ctx.fillRect(0,0,W,H);

  // Slot→x: 20 slots (0-9 DG1, gap 0.8, 10-19 DG2)
  const TOTAL_SLOTS=20.8;
  const SEP_GAP=0.8;
  function sx(slot){
    const s=slot>=10?slot+SEP_GAP:slot;
    return PAD.left+s*(cw/(TOTAL_SLOTS));
  }

  // Z range: -3 to zMax+1
  const zMax=Math.max(...pts.map(p=>p.z))+1;
  const zMin=-1.5;
  const zRange=zMax-zMin;
  function sy(z){return PAD.top+(1-(z-zMin)/zRange)*ch;}

  // Gitter
  ctx.strokeStyle='#1e2130';
  ctx.lineWidth=0.5;
  for(let zg=0;zg<=Math.ceil(zMax);zg+=2){
    const y=sy(zg);
    ctx.beginPath();ctx.moveTo(PAD.left,y);ctx.lineTo(W-PAD.right,y);ctx.stroke();
    ctx.fillStyle='#3a3f55';
    ctx.font='9px IBM Plex Mono,monospace';
    ctx.textAlign='right';
    ctx.fillText(zg,PAD.left-5,y+3);
  }
  // Z=0 Linie
  ctx.strokeStyle='#2a2d3a';
  ctx.lineWidth=1;
  const y0=sy(0);
  ctx.beginPath();ctx.moveTo(PAD.left,y0);ctx.lineTo(W-PAD.right,y0);ctx.stroke();

  // Separator
  const xsep=PAD.left+10.4*(cw/TOTAL_SLOTS);
  ctx.strokeStyle='rgba(255,61,46,0.25)';
  ctx.lineWidth=1;
  ctx.setLineDash([3,5]);
  ctx.beginPath();ctx.moveTo(xsep,PAD.top-10);ctx.lineTo(xsep,H-PAD.bottom+10);ctx.stroke();
  ctx.setLineDash([]);

  // DG Labels
  ctx.fillStyle='#2e3347';
  ctx.font='9px IBM Plex Mono,monospace';
  ctx.textAlign='center';
  ctx.fillText('Durchgang 1',PAD.left+5*(cw/TOTAL_SLOTS),PAD.top-12);
  ctx.fillText('Durchgang 2',PAD.left+15.4*(cw/TOTAL_SLOTS),PAD.top-12);

  // X Labels
  ctx.fillStyle='#3a3f55';
  ctx.font='8px IBM Plex Mono,monospace';
  ctx.textAlign='center';
  for(let s=0;s<=9;s++){
    const lbl=s===0?'0':'R'+s;
    ctx.fillText(lbl,sx(s),H-PAD.bottom+14);
  }
  for(let s=10;s<=19;s++){
    const lbl=s===10?'0':'R'+(s-10);
    ctx.fillText(lbl,sx(s),H-PAD.bottom+14);
  }

  // Linie
  const ACCENT='#3b82f6';
  // DG1 Linie
  const dg1pts=pts.filter(p=>p.dg===1||p.slot===0);
  ctx.strokeStyle=ACCENT;
  ctx.lineWidth=2.5;
  ctx.shadowColor=ACCENT;
  ctx.shadowBlur=8;
  ctx.beginPath();
  dg1pts.forEach((p,i)=>{
    const x=sx(p.slot),y=sy(p.z);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.shadowBlur=0;

  // DG1→DG2 gestrichelt
  const lastDG1=dg1pts[dg1pts.length-1];
  const anchorDG2=pts.find(p=>p.type==='anchor');
  if(lastDG1&&anchorDG2){
    ctx.strokeStyle=ACCENT;
    ctx.lineWidth=1;
    ctx.setLineDash([4,5]);
    ctx.globalAlpha=0.3;
    ctx.beginPath();
    ctx.moveTo(sx(lastDG1.slot),sy(lastDG1.z));
    ctx.lineTo(sx(anchorDG2.slot),sy(anchorDG2.z));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha=1;
  }

  // DG2 Linie: in zusammenhängende Segmente aufteilen (Lücke bei pending)
  // Segment = aufeinanderfolgende gespielte Punkte ohne pending dazwischen
  if(anchorDG2){
    const dg2all=pts.filter(p=>p.dg===2&&p.type!=='anchor');
    // Segmente bauen: beginne mit Anker, breche bei pending ab
    const segments=[];
    let seg=[anchorDG2];
    for(const p of dg2all){
      if(p.type==='pending'){
        if(seg&&seg.length>1)segments.push(seg);
        seg=null; // nach Lücke: kein Anschluss mehr
      } else {
        if(seg===null){
          // isolierter Punkt nach Lücke
          segments.push([p]);
        } else {
          seg.push(p);
        }
      }
    }
    if(seg&&seg.length>1)segments.push(seg);
    // Einzelpunkte nach Lücke separat sammeln
    // (bereits als Ein-Element-Arrays in segments)

    segments.forEach(s=>{
      if(s.length===1){
        return;
      }
      ctx.strokeStyle=ACCENT;
      ctx.lineWidth=2.5;
      ctx.shadowColor=ACCENT;
      ctx.shadowBlur=8;
      ctx.beginPath();
      s.forEach((p,i)=>{
        const x=sx(p.slot),y=sy(p.z);
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      });
      ctx.stroke();
    });
    ctx.shadowBlur=0;
    ctx.shadowColor='transparent';
  }

  // Dots
  const COL={win:'#22c55e',draw:'#60a5fa',loss:'#ef4444'};
  pts.forEach(p=>{
    if(p.type==='start'||p.type==='anchor')return;
    const x=sx(p.slot),y=sy(p.z);
    if(p.type==='pending'){
      // Raute
      ctx.strokeStyle='#3b82f6';
      ctx.fillStyle='rgba(0,0,0,0)';
      ctx.lineWidth=1.5;
      ctx.globalAlpha=0.5;
      ctx.beginPath();
      ctx.moveTo(x,y-6);ctx.lineTo(x+6,y);ctx.lineTo(x,y+6);ctx.lineTo(x-6,y);ctx.closePath();
      ctx.stroke();
      ctx.globalAlpha=1;
      // Ergebnis-Label
      ctx.fillStyle='#3a3f55';
      ctx.font='7px IBM Plex Mono,monospace';
      ctx.textAlign='center';
      ctx.fillText('–',x,H-PAD.bottom+26);
      ctx.fillText(p.opp,x,H-PAD.bottom+36);
      return;
    }
    const col=COL[p.type];
    ctx.beginPath();
    ctx.arc(x,y,4.5,0,Math.PI*2);
    ctx.fillStyle='#141720';
    ctx.fill();
    ctx.strokeStyle=col;
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x,y,2.5,0,Math.PI*2);
    ctx.fillStyle=col;
    ctx.fill();
    // Z-Wert Label (oben)
    ctx.fillStyle='#9ca3af';
    ctx.font='8px IBM Plex Mono,monospace';
    ctx.textAlign='center';
    ctx.fillText(p.z.toFixed(1),x,y-9);
    // Ergebnis unter X-Achse
    ctx.fillStyle='#3a3f55';
    ctx.font='7px IBM Plex Mono,monospace';
    ctx.fillText(p.a+':'+p.b,x,H-PAD.bottom+26);
    ctx.fillText(p.opp,x,H-PAD.bottom+36);
  });

  // End-Label
  const lastPt=pts.filter(p=>p.type!=='pending'&&p.type!=='anchor'&&p.z!==undefined).slice(-1)[0];
  if(lastPt){
    ctx.fillStyle=ACCENT;
    ctx.font='bold 11px IBM Plex Mono,monospace';
    ctx.textAlign='left';
    ctx.fillText(lastPt.z.toFixed(1),sx(lastPt.slot)+8,sy(lastPt.z)+4);
  }
}

let rafId=null;
new ResizeObserver(()=>{
  if(rafId)cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(()=>{render();rafId=null;});
}).observe(canvas);
</script>
</body>
</html>
