:root{--bg:#0d0f14;--bg2:#141720;--txt:#e2e8f0;--txt2:#94a3b8;--border:#2a3045;
  --blue:#4a9eff;--brown:#c8843a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans',sans-serif;font-size:14px;padding:16px;max-width:390px;}
h1{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--txt2);margin-bottom:16px;letter-spacing:2px;text-transform:uppercase;}
.block{margin-bottom:16px;}
.block-title{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;padding:6px 0 6px 0;border-bottom:1px solid var(--border);margin-bottom:8px;}
.block-title b{color:var(--txt);font-size:12px;}
.btns{display:flex;flex-wrap:wrap;gap:5px;}
.btn{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:4px 9px;border-radius:4px;border:none;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
.btn:hover{opacity:.75;}
.btn.wttv{background:rgba(74,158,255,.15);color:var(--blue);border:1px solid rgba(74,158,255,.35);}
.btn.voeb{background:rgba(200,132,58,.15);color:var(--brown);border:1px solid rgba(200,132,58,.35);}
</style>
</head>
