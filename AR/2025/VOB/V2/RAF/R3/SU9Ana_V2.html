<!DOCTYPE html>
<html lang="de">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DG2 · R3 · Spielfrei</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap');
:root{--bg:#0d0f14;--bg2:#141720;--bg3:#1c2030;--acc:#fb923c;--green:#4ade80;--yellow:#fbbf24;--red:#f87171;--txt:#e2e8f0;--txt2:#94a3b8;--border:#2a3045;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.5;padding:16px;}
h1{font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--acc);margin-bottom:4px;}
h2{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--acc);border-bottom:1px solid var(--border);padding-bottom:6px;margin:18px 0 10px;}
.meta{font-size:12px;color:var(--txt2);margin-bottom:16px;}
.section{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px;}
.result-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
.score{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;}
.score.win{color:var(--green);}
.score.loss{color:var(--red);}
.score.draw{color:var(--yellow);}
.badge{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600;}
.badge.win{background:rgba(74,222,128,.15);color:var(--green);border:1px solid rgba(74,222,128,.3);}
.badge.loss{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3);}
.badge.draw{background:rgba(251,191,36,.15);color:var(--yellow);border:1px solid rgba(251,191,36,.3);}
.badge.free{background:rgba(148,163,184,.1);color:var(--txt2);border:1px solid rgba(148,163,184,.2);}
.game-table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12px;}
.game-table th{color:var(--txt2);font-weight:600;padding:4px 8px;text-align:left;border-bottom:1px solid var(--border);}
.game-table td{padding:4px 8px;border-bottom:1px solid rgba(42,48,69,.5);}
.game-table tr:last-child td{border-bottom:none;}
.w{color:var(--green);}
.l{color:var(--red);}
.player-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:8px;}
.player-card{background:var(--bg3);border-radius:6px;padding:10px;}
.player-name{font-weight:600;font-size:13px;margin-bottom:4px;}
.player-pos{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--txt2);}
.player-stat{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:700;margin-top:4px;}
.stat-bar{height:4px;background:var(--bg);border-radius:2px;margin-top:4px;overflow:hidden;}
.stat-fill{height:100%;border-radius:2px;}
.note{font-size:12px;color:var(--txt2);font-style:italic;margin-top:8px;}
.info-row{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--txt2);margin-bottom:8px;}
.info-row span b{color:var(--txt);}
.tag{font-family:'IBM Plex Mono',monospace;font-size:10px;background:rgba(251,146,60,.1);color:var(--acc);border:1px solid rgba(251,146,60,.2);border-radius:3px;padding:1px 5px;display:inline-block;margin-right:4px;}
</style>

</head>
<body>
<h1>SU9 · VÖB V2 · DG2 · R3 · Spielfrei</h1>
<div class="meta">VÖB 3. Klasse · Frühjahr 2026 · Runde 3</div>
<div class="section"><h2>01 · Spielanalyse</h2>
<div class="result-bar"><span class="score draw">–</span><span class="badge free">SPIELFREI</span></div>
<div class="info-row"><span><b>Runde 3:</b> Spielfrei</span></div>
<p>SU9 2 hatte in Runde 3 (DG2) kein Spiel — Freilos.</p></div>
<div class="section"><h2>07 · DG2 nach R3</h2><p class="note">1 Punkt · 0S/1N/1R (unverändert)</p></div>
</body></html>
