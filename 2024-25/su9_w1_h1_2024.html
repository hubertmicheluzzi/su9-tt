<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SU9 · W1 · H1 · 2024/25</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');

  :root {
    --bg:        #0d0f14;
    --panel:     #141720;
    --border:    #252a38;
    --accent:    #ff3d2e;
    --gold:      #f5c842;
    --text:      #e8eaf0;
    --muted:     #6b7280;
    --grid:      #1e2333;
    --positive:  #22c55e;
    --negative:  #ef4444;
    --neutral:   #60a5fa;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 40px;
  }

  .card {
    max-width: 780px;
    margin: 0 auto;
    background: var(--panel);
    overflow: hidden;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, #1a0a08 0%, #0d1220 100%);
    border-bottom: 3px solid var(--accent);
    padding: 28px 28px 22px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,61,46,.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .club-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.9rem, 7vw, 3.2rem);
    color: var(--text);
    letter-spacing: 0.08em;
    line-height: 1;
    margin-bottom: 10px;
  }

  .players-line {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: clamp(.78rem, 2.2vw, .92rem);
    font-weight: 400;
    line-height: 1.5;
    margin-bottom: 7px;
  }
  .pl-stamp { color: var(--accent); }
  .pl-guest { color: var(--text); }

  .period-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(.68rem, 1.8vw, .78rem);
    color: var(--muted);
    letter-spacing: .06em;
  }

  /* ── CHART AREA ── */
  .chart-section {
    padding: 24px 20px 28px;
  }

  .chart-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  svg#chart {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  /* ── FOOTER ── */
  .footer {
    border-top: 1px solid var(--border);
    padding: 12px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .footer-note {
    font-size: .65rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: .06em;
  }
  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: .65rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }
  .legend-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="card">

  <!-- HEADER -->
  <div class="header">
    <div class="club-title">SU9 WTTV 3.KL MS 2024/25</div>
    <div class="players-line">
      <span class="pl-stamp">Michael, Richard, Max, Chiril</span>
      &nbsp;
      <span class="pl-guest">(Christian)</span>
    </div>
    <div class="period-line">Okt. 2024 – Apr. 2025</div>
  </div>

  <!-- CHART -->
  <div class="chart-section">
    <div class="chart-title">Wertungspunkte-Verlauf · kumuliert</div>
    <svg id="chart" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background:#22c55e"></div>
        <span>Sieg (+2 +A−B/10)</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#60a5fa"></div>
        <span>Unentschieden (+1)</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#ef4444"></div>
        <span>Niederlage (A−B/10)</span>
      </div>
    </div>
    <div class="footer-note">SU9Ana · WTTV · W1 H1 · 2024/25</div>
  </div>

</div>

<script>
// WTTV W1 2024/25 — SU9 Spielpunkte A : Gegner B
// Dg1: 9 Runden, Dg2: 9 Runden → 18 gesamt
const rounds = [
  // Durchgang 1
  { rnd:1,  label:'D1·R1', A:3, B:6, sf:false },  // SU9 3:6 LENZ5
  { rnd:2,  label:'D1·R2', A:4, B:6, sf:false },  // WPAE9 6:4 SU9 → SU9=4
  { rnd:3,  label:'D1·R3', A:2, B:6, sf:false },  // SU9 2:6 SSH2
  { rnd:4,  label:'D1·R4', A:5, B:5, sf:false },  // LSV5 5:5 SU9
  { rnd:5,  label:'D1·R5', A:6, B:1, sf:false },  // SU9 6:1 MAR4
  { rnd:6,  label:'D1·R6', A:6, B:1, sf:false },  // SU9 6:1 KAI2
  { rnd:7,  label:'D1·R7', A:4, B:6, sf:false },  // SKFL9 6:4 SU9 → SU9=4
  { rnd:8,  label:'D1·R8', A:5, B:5, sf:false },  // SU9 5:5 SSH4
  { rnd:9,  label:'D1·R9', A:2, B:6, sf:false },  // PER1 6:2 SU9 → SU9=2
  // Durchgang 2
  { rnd:10, label:'D2·R1', A:5, B:5, sf:false },  // LENZ5 5:5 SU9
  { rnd:11, label:'D2·R2', A:4, B:6, sf:false },  // SU9 4:6 WPAE9
  { rnd:12, label:'D2·R3', A:0, B:7, sf:false },  // SSH2 7:0 SU9
  { rnd:13, label:'D2·R4', A:6, B:3, sf:false },  // SU9 6:3 LSV5
  { rnd:14, label:'D2·R5', A:0, B:7, sf:false },  // MAR4 7:0 SU9 (w.o.)
  { rnd:15, label:'D2·R6', A:5, B:5, sf:false },  // KAI2 5:5 SU9
  { rnd:16, label:'D2·R7', A:6, B:3, sf:false },  // SU9 6:3 SKFL9
  { rnd:17, label:'D2·R8', A:6, B:3, sf:false },  // SSH4 3:6 SU9 → SU9=6
  { rnd:18, label:'D2·R9', A:5, B:5, sf:false },  // SU9 5:5 PER1
];

function calcDelta(d) {
  if (d.sf) return 0;
  if (d.A > d.B) return 2 + (d.A - d.B) / 10;
  if (d.A === d.B) return 1;
  return (d.A - d.B) / 10;
}

let cum = 0;
const points = [{ rnd: 0, z: 0, sf: false, delta: 0 }];
for (const d of rounds) {
  const delta = calcDelta(d);
  cum = Math.round((cum + delta) * 1000) / 1000;
  points.push({ rnd: d.rnd, label: d.label, z: cum, sf: d.sf, delta });
}

// ── SVG CHART ──
const svg = document.getElementById('chart');
const W = 680, H = 300;
const PAD = { top: 18, right: 24, bottom: 52, left: 46 };
const CW = W - PAD.left - PAD.right;
const CH = H - PAD.top - PAD.bottom;

const zVals = points.map(p => p.z);
const zMin = Math.min(...zVals);
const zMax = Math.max(...zVals);
const yMin = Math.floor(zMin - 0.8);
const yMax = Math.ceil(zMax + 0.8);
const nRounds = rounds.length;

function xPos(rnd) { return PAD.left + (rnd / nRounds) * CW; }
function yPos(z)   { return PAD.top + (1 - (z - yMin) / (yMax - yMin)) * CH; }

const C = {
  bg: '#0d0f14', grid: '#1e2333', axis: '#3a4155', label: '#6b7280',
  line: '#ff3d2e',
  dot_win: '#22c55e', dot_neu: '#60a5fa', dot_los: '#ef4444',
  zero: '#374151', dg_sep: '#252a38',
};

let out = '';
out += `<rect width="${W}" height="${H}" fill="${C.bg}" rx="2"/>`;
out += `<defs><clipPath id="cp"><rect x="${PAD.left}" y="${PAD.top}" width="${CW}" height="${CH}"/></clipPath></defs>`;

// Y grid + labels
const yRange = yMax - yMin;
for (let yt = Math.ceil(yMin); yt <= Math.floor(yMax); yt++) {
  if (yRange > 12 && yt % 2 !== 0) continue;
  const yp = yPos(yt);
  const isZero = yt === 0;
  out += `<line x1="${PAD.left}" y1="${yp}" x2="${PAD.left+CW}" y2="${yp}"
    stroke="${isZero ? C.zero : C.grid}" stroke-width="${isZero ? 1.5 : 0.7}"
    stroke-dasharray="${isZero ? '4,3' : 'none'}"/>`;
  out += `<text x="${PAD.left-7}" y="${yp+4}" text-anchor="end"
    font-family="IBM Plex Mono, monospace" font-size="9" fill="${isZero ? '#9ca3af' : C.label}">${yt}</text>`;
}

// Dg separator (between rnd 9 and 10)
const xSep = xPos(9);
out += `<line x1="${xSep}" y1="${PAD.top}" x2="${xSep}" y2="${PAD.top+CH}"
  stroke="${C.dg_sep}" stroke-width="1.2" stroke-dasharray="5,4" clip-path="url(#cp)"/>`;
out += `<text x="${PAD.left + CW*0.25}" y="${PAD.top-6}" text-anchor="middle"
  font-family="IBM Plex Mono, monospace" font-size="9" fill="#4b5563" letter-spacing="1">DURCHGANG 1</text>`;
out += `<text x="${PAD.left + CW*0.75}" y="${PAD.top-6}" text-anchor="middle"
  font-family="IBM Plex Mono, monospace" font-size="9" fill="#4b5563" letter-spacing="1">DURCHGANG 2</text>`;

// X ticks + labels
for (let i = 1; i <= nRounds; i++) {
  const xp = xPos(i);
  const rLabel = `R${i <= 9 ? i : i - 9}`;
  out += `<line x1="${xp}" y1="${PAD.top+CH}" x2="${xp}" y2="${PAD.top+CH+5}" stroke="${C.axis}" stroke-width="0.8"/>`;
  out += `<text x="${xp}" y="${PAD.top+CH+16}" text-anchor="middle"
    font-family="IBM Plex Mono, monospace" font-size="8.5" fill="${C.label}">${rLabel}</text>`;
}

// Axes
out += `<line x1="${PAD.left}" y1="${PAD.top}" x2="${PAD.left}" y2="${PAD.top+CH}" stroke="${C.axis}" stroke-width="1"/>`;
out += `<line x1="${PAD.left}" y1="${PAD.top+CH}" x2="${PAD.left+CW}" y2="${PAD.top+CH}" stroke="${C.axis}" stroke-width="1"/>`;
out += `<text transform="rotate(-90)" x="${-(PAD.top+CH/2)}" y="12" text-anchor="middle"
  font-family="IBM Plex Mono, monospace" font-size="9" fill="${C.label}" letter-spacing="1">WERTUNG</text>`;
out += `<text x="${PAD.left+CW/2}" y="${H-4}" text-anchor="middle"
  font-family="IBM Plex Mono, monospace" font-size="9" fill="${C.label}" letter-spacing="1">RUNDE</text>`;

// Line path
let pathD = '';
for (let i = 0; i < points.length; i++) {
  const p = points[i];
  pathD += (i===0?'M':'L') + `${xPos(p.rnd)},${yPos(p.z)} `;
}
out += `<path d="${pathD.trim()}" fill="none" stroke="#ff3d2e" stroke-width="5" stroke-opacity="0.12"
  stroke-linejoin="round" stroke-linecap="round" clip-path="url(#cp)"/>`;
out += `<path d="${pathD.trim()}" fill="none" stroke="${C.line}" stroke-width="2.5"
  stroke-linejoin="round" stroke-linecap="round" clip-path="url(#cp)"/>`;

// Dots + Z labels
for (let i = 1; i < points.length; i++) {
  const p = points[i];
  const xp = xPos(p.rnd);
  const yp = yPos(p.z);
  const col = p.delta > 1 ? C.dot_win : (p.delta === 1 ? C.dot_neu : C.dot_los);
  out += `<circle cx="${xp}" cy="${yp}" r="5" fill="${C.bg}" stroke="${col}" stroke-width="2"/>`;
  out += `<circle cx="${xp}" cy="${yp}" r="2.5" fill="${col}"/>`;
  const textY = p.z >= points[i-1].z ? yp - 10 : yp + 18;
  out += `<text x="${xp}" y="${textY}" text-anchor="middle"
    font-family="IBM Plex Mono, monospace" font-size="8" fill="#9ca3af">${p.z.toFixed(1)}</text>`;
}

svg.innerHTML = out;
</script>
</body>
</html>
